[project]
name = "mathdesk-api"
version = "0.1.0"
description = "mathdesk API server"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "olefile>=0.47",
    "openpyxl>=3.1",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
