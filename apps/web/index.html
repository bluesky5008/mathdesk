<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mathdesk</title>
    <!-- 첫 페인트 전에 테마를 적용해 라이트→선택테마 번쩍임을 막는다. React보다 먼저 실행되어야
         하므로 인라인이다. 키 이름은 src/theme.ts의 THEME_STORAGE_KEY와 같아야 한다. -->
    <script>
      try {
        var t = localStorage.getItem('mathdesk-theme')
        if (t) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
