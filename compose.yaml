services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mathdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathdesk}
      POSTGRES_DB: mathdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8000"

  web:
    build: ./apps/web
    environment:
      VITE_API_ORIGIN: http://api:8000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  pgdata:
