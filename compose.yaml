services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mathdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathdesk}
      POSTGRES_DB: mathdesk
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://mathdesk:${POSTGRES_PASSWORD:-mathdesk}@postgres:5432/mathdesk
      # 비워 두면 초기 원장 계정을 만들지 않는다. .env에서 지정한다.
      MATHDESK_INITIAL_ADMIN_ID: ${MATHDESK_INITIAL_ADMIN_ID:-}
      MATHDESK_INITIAL_ADMIN_PASSWORD: ${MATHDESK_INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8000"

  web:
    build: ./apps/web
    environment:
      VITE_API_ORIGIN: http://api:8000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  pgdata:
