services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mathdesk
      # 로컬 전용 고정값. 테스트 운영 비밀번호(.env)와 섞이지 않게 변수를 쓰지 않는다.
      POSTGRES_PASSWORD: mathdesk
      POSTGRES_DB: mathdesk
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # 컨텍스트가 저장소 루트인 이유는 apps/api/Dockerfile 머리말 참조
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://mathdesk:mathdesk@postgres:5432/mathdesk
      # 비워 두면 초기 원장 계정을 만들지 않는다. .env에서 지정한다.
      MATHDESK_INITIAL_ADMIN_ID: ${MATHDESK_INITIAL_ADMIN_ID:-}
      MATHDESK_INITIAL_ADMIN_PASSWORD: ${MATHDESK_INITIAL_ADMIN_PASSWORD:-}
      MATHDESK_STORAGE_ROOT: /var/lib/mathdesk/files
    volumes:
      - files:/var/lib/mathdesk/files
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8000"

  web:
    build: ./apps/web
    environment:
      VITE_API_ORIGIN: http://api:8000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  pgdata:
  files:
