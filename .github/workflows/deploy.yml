# 운영 반영(ADR-015 결정 3·4·10): 사용자가 Actions 에서 직접 실행할 때만 돈다(push 로는 절대 돌지 않는다).
# 대상마다 GitHub 환경(bam·pingsu, 필수 승인자 = 사용자)을 거쳐, 환경 비밀값의 배포 전용 SSH 키로
# 서버의 deploy 계정에 접속한다. 그 키는 authorized_keys 의 command= 제한으로 ops/deploy.sh 만 실행한다.
# 서드파티 액션을 쓰지 않는다. 입력값은 환경변수로만 셸에 전달한다.
name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상"
        type: choice
        required: true
        options: [bam, pingsu, both]
      tag:
        description: "릴리스 태그 (예: 2026.10.17). release 워크플로에서 -verified 까지 통과한 태그만 받는다"
        type: string
        required: true

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: 태그 형식과 verified 꼬리표 확인
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^20[0-9]{2}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]] || { echo "::error::태그 형식 오류: $TAG"; exit 1; }
          docker manifest inspect "$IMAGE:$TAG-verified" > /dev/null \
            || { echo "::error::$TAG 는 release 스모크를 통과하지 않았습니다"; exit 1; }
      - id: targets
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            both) echo 'targets=["bam","pingsu"]' ;;
            bam|pingsu) echo "targets=[\"$TARGET\"]" ;;
            *) echo "::error::대상 오류"; exit 1 ;;
          esac >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-24.04
    environment: ${{ matrix.target }}
    steps:
      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
      - name: 서버 deploy.sh 실행 (${{ matrix.target }})
        env:
          TAG: ${{ inputs.tag }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "deploy@$DEPLOY_HOST" "$TAG"
