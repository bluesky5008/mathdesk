# CI(ADR-015 결정 1): main push 와 PR 마다 API·웹 테스트와 빌드를 검증한다. 이미지는 만들지 않는다(release.yml).
# 서드파티 액션을 쓰지 않는다(ADR-015 결정 10). GitHub 소유 액션은 커밋 SHA 로 고정한다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mathdesk
          POSTGRES_PASSWORD: mathdesk
          POSTGRES_DB: mathdesk_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mathdesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: uv 설치 (Dockerfile 과 같은 0.12 계열)
        run: pip install "uv>=0.12,<0.13"
      - run: uv sync --frozen
      - name: Chromium headless shell (리포트 렌더러가 앱 기동 시 띄운다)
        run: uv run playwright install --with-deps --only-shell chromium
      - name: pytest
        env:
          MATHDESK_TEST_DATABASE_URL: postgresql+asyncpg://mathdesk:mathdesk@localhost:55432/mathdesk_test
        run: uv run pytest -q -p no:cacheprovider

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - name: 타입 검사와 빌드
        run: npm run build
